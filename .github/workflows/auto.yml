name: Auto Anime Video Factory

on:
  schedule:
    - cron: '0 5-22 * * *'  # सुबह 5 बजे से रात 10 बजे तक हर घंटे
  workflow_dispatch:

jobs:
  build_video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install FFmpeg & Deep Voice Engine
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests edge-tts "moviepy<2.0.0" decorator imageio imageio-ffmpeg
      - name: Make Trending Anime Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MY_GMAIL: ${{ secrets.MY_GMAIL }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python bot.py
      - name: Save Ready MP4 Video
        uses: actions/upload-artifact@v4
        with:
          name: Ready-Anime-Short-MP4
          path: |
            Ready_Anime_Short.mp4
            Video_Title.txt
